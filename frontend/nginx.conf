server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Default proxy headers for all backend proxy locations
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
    }

    # Dynamic sitemap (products + static pages) from backend
    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/v1/sitemap.xml;
        add_header Cache-Control "public, max-age=3600";
    }

    # Dynamic robots.txt
    location = /robots.txt {
        proxy_pass http://backend:8000/api/v1/robots.txt;
        add_header Cache-Control "public, max-age=86400";
    }

    # Proxy uploaded images to the backend
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        # Cache uploaded files (images, logos) for 7 days
        add_header Cache-Control "public, max-age=604800";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Dynamic meta-tags preview for social crawlers across all SPA routes (Telegram, WhatsApp, Twitter, Facebook, Discord, etc.)
    location / {
        if ($http_user_agent ~* "TelegramBot|Twitterbot|facebookexternalhit|WhatsApp|Discordbot|vkShare|Slackbot|LinkedInBot|Pinterest|Baiduspider|SkypeUriPreview|Google-Structured-Data-Testing-Tool") {
            proxy_pass http://backend:8000/api/v1/meta-preview?uri=$uri;
            break;
        }
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for HTML (SPA entry point)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
