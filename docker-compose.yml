version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    volumes:
      - db_data:/app/data
      - uploads_data:/app/uploads
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - JWT_SECRET=${JWT_SECRET:?change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
