; PrusaSlicer config for Anycubic Kobra S1 (0.4 nozzle)
; Generated from OrcaSlicer system profiles

; ── Printer ──
printer_technology = FFF
nozzle_diameter = 0.4
printable_area = 0x0,250x0,250x250,0x250
printable_height = 250
gcode_flavor = klipper
host_type = octoprint
extruder_offset = 0x0
retract_length = 0.8

; ── Print (0.20mm Standard) ──
layer_height = 0.2
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 3
infill_density = 15%
infill_pattern = grid
brim_gap = 0.1
support_material = 0
line_width = 0.42
print_speed = 150

; ── Filament (Generic PLA) ──
filament_type = PLA
filament_density = 1.24
temperature = 205
filament_diameter = 1.75
filament_max_volumetric_speed = 12

; ── Bed ──
bed_temperature = 60

; ── Cooling ──
fan_always_on = 1
min_fan_speed = 30
max_fan_speed = 100
