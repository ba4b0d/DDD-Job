; PrusaSlicer config for Anycubic Kobra S1 (0.4mm brass nozzle)
; Rebuilt from the OFFICIAL OrcaSlicer "Anycubic Kobra S1 0.4 nozzle" system profile:
;   machine/Anycubic Kobra S1 0.4 nozzle.json
;   process/0.20mm Standard @Anycubic Kobra S1 0.4 nozzle.json
;   filament/Anycubic PLA @Anycubic Kobra S1 0.4 nozzle.json
; These values match what YOU slice with in OrcaSlicer, so time/weight
; estimates from the CLI now reflect your real printing settings.
;
; NOTE: no inline comments — PrusaSlicer config parser rejects trailing "; ..."

; ============================================================
; PRINTER (machine)
; ============================================================
printer_technology     = FFF
gcode_flavor           = klipper
printer_structure      = corexy
nozzle_diameter        = 0.4
printable_area         = 0x0,250x0,250x250,0x250
printable_height       = 250
host_type              = octoprint
extruder_offset        = 0x0
single_extruder_multi_material = 1
use_relative_e_distances = 1
use_firmware_retraction = 0

; Tuning profile (pressure advance baked into firmware)
pressure_advance       = 0.035

; travel / motion limits (official)
machine_max_speed_x    = 600
machine_max_speed_y    = 600
machine_max_speed_z    = 15
machine_max_acceleration_x = 10000
machine_max_acceleration_y = 10000
machine_max_acceleration_e = 5000
machine_max_jerk_x     = 9
machine_max_jerk_y     = 9
machine_max_jerk_e     = 2.5

; retraction (0.8 mm direct-drive)
retract_length         = 0.8
retract_speed          = 40
retract_lift_above     = 0.3
retract_lift_below     = 249
wipe                   = 1
wipe_distance          = 1
retract_before_wipe    = 0%
z_hop                  = 0.4
retract_when_changing_layer = 1

; ============================================================
; PRINT (0.20mm Standard)
; ============================================================
layer_height           = 0.2
perimeters             = 2
top_solid_layers       = 5
bottom_solid_layers    = 3
only_one_wall_top      = 1
line_width             = 0.42
inner_wall_line_width  = 0.45
outer_wall_line_width  = 0.42

; infill 15% crosshatch (official)
fill_density           = 15%
fill_pattern           = crosshatch
minimum_sparse_infill_area = 15
infill_anchor          = 400%
infill_direction       = 45
top_fill_pattern       = monotonicline
bottom_fill_pattern    = monotonic

; SPEEDS (official — these drive the print-time estimate)
outer_perimeter_speed  = 200
perimeter_speed        = 300
infill_speed           = 270
solid_infill_speed     = 250
top_solid_infill_speed = 200
support_material_speed = 150
bridge_speed           = 30
gap_fill_speed         = 250
skirt_speed            = 50
first_layer_speed      = 50
first_layer_infill_speed = 80
travel_speed           = 300
max_print_speed        = 300

; acceleration / jerk
default_acceleration   = 10000
outer_wall_acceleration = 5000
inner_wall_acceleration = 5000
top_surface_acceleration = 2000
bridge_acceleration    = 50%
default_jerk           = 9

; adhesion / supports
support_material       = 0
support_threshold_angle = 30
support_type           = tree
brim_type              = auto_brim
brim_width             = 5
brim_object_gap        = 0.1
elefant_foot_compensation = 0.075

; ============================================================
; FILAMENT (Anycubic PLA)
; ============================================================
filament_type          = PLA
filament_density       = 1.24
filament_diameter      = 1.75
filament_flow_ratio    = 0.98
filament_max_volumetric_speed = 12
temperature            = 205
first_layer_temperature = 215
bed_temperature        = 55
first_layer_bed_temperature = 55
temperature_range_low  = 190
temperature_range_high = 240

; cooling (official)
fan_always_on          = 0
min_fan_speed          = 100
max_fan_speed          = 100
slow_down_below_layer_time = 8
slowdown_min_speed     = 20
