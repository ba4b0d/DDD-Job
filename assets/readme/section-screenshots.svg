<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Screenshots — Spaghetti in production</title>
  <desc id="banner-desc">Section header showing the Screenshots title with a filament-curl motif.</desc>

  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a3d"/>
      <stop offset="0.5" stop-color="#ffc66e"/>
      <stop offset="1" stop-color="#e07b2c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" rx="18" fill="#ffffff" stroke="#c0c8dc"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="140" rx="4" fill="url(#bar)"/>

  <!-- Filament curl motif (right) -->
  <g transform="translate(940 30)" fill="none" stroke="url(#bar)" stroke-width="3" stroke-linecap="round">
    <path d="M0 80 C 30 0, 90 0, 120 80 S 200 80, 220 0"/>
    <path d="M0 50 C 30 -10, 90 -10, 120 50 S 200 50, 220 -10" opacity="0.5"/>
  </g>

  <!-- Title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="60" font-size="34" font-weight="700" fill="#1a1f32">Screenshots</text>
    <text x="40" y="96" font-size="18" fill="#4a5270">Six real captures from the running app — admin, board, calculator, public catalog</text>
  </g>
</svg>
